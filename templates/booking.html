<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Bajaj - Bajaj Semarang</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
            font-family:Arial, sans-serif;
        }

        .hero{
            background:linear-gradient(135deg,#dc3545,#fd7e14);
            color:white;
            padding:60px 20px;
            text-align:center;
        }

        .booking-card{
            border:none;
            border-radius:25px;
            box-shadow:0 10px 30px rgba(0,0,0,.1);
            margin-top:-40px;
        }

        .info-card{
            border:none;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,.08);
        }
    </style>
</head>
<body>

<div class="hero">

    <h1>🛺 Pesan Bajaj Semarang</h1>

    <p>
        Antar Jemput & City Tour Semarang
    </p>

</div>

<div class="container mb-5">

    <div class="card booking-card">

        <div class="card-body p-5">

            <h3 class="mb-4">
                Form Pemesanan
            </h3>

            <form method="POST" action="/booking">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Nama Lengkap</label>

                        <input type="text"
                               name="nama"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>No. HP</label>

                        <input type="text"
                               name="no_hp"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="mb-3">

                    <label>Lokasi Penjemputan</label>

                    <input type="text"
                           name="lokasi_jemput"
                           class="form-control"
                           placeholder="Contoh: Simpang Lima"
                           required>

                </div>

                <div class="mb-3">

                    <label>Tujuan</label>

                    <input type="text"
                           name="tujuan"
                           class="form-control"
                           placeholder="Contoh: Kota Lama"
                           required>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Jenis Layanan</label>

                        <select name="layanan"
                                class="form-select"
                                required>

                            <option value="">
                                Pilih Layanan
                            </option>

                            <option>
                                Antar Jemput
                            </option>

                            <option>
                                City Tour
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Tanggal</label>

                        <input type="date"
                               name="tanggal"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="mb-4">

                    <label>Catatan Tambahan</label>

                    <textarea name="catatan"
                              rows="4"
                              class="form-control"
                              placeholder="Opsional"></textarea>

                </div>

                <button class="btn btn-danger btn-lg w-100">

                    🛺 Pesan Sekarang

                </button>

            </form>

        </div>

    </div>

    <div class="row mt-5 g-4">

        <div class="col-md-4">

            <div class="card info-card p-4 text-center">

                <h2>💰</h2>

                <h5>Tarif</h5>

                <p>
                    Antar jemput mulai Rp15.000.
                </p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card info-card p-4 text-center">

                <h2>🏛️</h2>

                <h5>City Tour</h5>

                <p>
                    Mulai Rp75.000 per jam.
                </p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card info-card p-4 text-center">

                <h2>🕐</h2>

                <h5>Operasional</h5>

                <p>
                    Setiap hari 06.00–22.00 WIB.
                </p>

            </div>

        </div>

    </div>

    <div class="text-center mt-5">

        <a href="/" class="btn btn-secondary">
            ← Kembali ke Beranda
        </a>

    </div>

</div>

</body>
</html>
