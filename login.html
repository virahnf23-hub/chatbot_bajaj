<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Bajaj Semarang</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
                linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.5)),
                url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=1600');
            background-size:cover;
            background-position:center;
            font-family:Arial, sans-serif;
        }

        .login-card{
            width:100%;
            max-width:420px;
            background:white;
            border-radius:25px;
            padding:40px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        .logo{
            font-size:55px;
            text-align:center;
        }

        .title{
            text-align:center;
            font-weight:bold;
            color:#dc3545;
        }

        .subtitle{
            text-align:center;
            color:#6c757d;
            margin-bottom:30px;
        }

        .btn-login{
            background:#dc3545;
            border:none;
            border-radius:12px;
            padding:12px;
        }

        .btn-login:hover{
            background:#bb2d3b;
        }

        .back-link{
            text-decoration:none;
            color:#dc3545;
            font-weight:500;
        }

        .back-link:hover{
            color:#bb2d3b;
        }
    </style>
</head>
<body>

<div class="login-card">

    <div class="logo">
        🛺
    </div>

    <h2 class="title">
        Admin Bajaj Semarang
    </h2>

    <p class="subtitle">
        Silakan masuk untuk mengelola sistem.
    </p>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input type="text"
                   name="username"
                   class="form-control form-control-lg"
                   placeholder="Masukkan username"
                   required>

        </div>

        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input type="password"
                   name="password"
                   class="form-control form-control-lg"
                   placeholder="Masukkan password"
                   required>

        </div>

        <button type="submit"
                class="btn btn-danger btn-login w-100">

            Login

        </button>

    </form>

    <div class="text-center mt-4">

        <a href="/" class="back-link">
            ← Kembali ke Beranda
        </a>

    </div>

    <hr>

    <div class="text-center text-muted">

        <small>
            Demo Project Bajaj Semarang
        </small>

    </div>

</div>

</body>
</html>
